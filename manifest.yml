name: 随机抽选
id: gordon.randompicker
description: 桌面抽人悬浮窗。点击弹菜单，抽个人或抽小组，屏幕中央弹出大字（抽小组时组名下列出成员）；支持拍照抽人，从合影中检测人脸随机抽取。名单与小组均为纯文本，保存即生效。
