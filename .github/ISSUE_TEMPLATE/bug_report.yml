name: 问题反馈
description: 抽选结果不对、界面异常、装不上等等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。下面几项尽量填全，尤其是**版本号**和**复现步骤** ——
        没有这两样很难判断问题是不是已经修过了。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 现象是什么？屏幕中央弹的是什么、悬浮球上那行字对不对，都可以写。
      placeholder: 选了「抽 2 个组」，结果屏幕中央弹出的是同一个组两次。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开软件开始写，能稳定复现最好；只出现过一次也照实写。
      value: |
        1. 打开 ClassIsland，悬浮球出现在屏幕上
        2. 右键悬浮球，选择 ……
        3. 点击「抽一个」
        4. ……
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 当时的抽选来源
      options:
        - 随机抽人（从名单里抽）
        - 随机抽组
        - 拍照抽人
        - 和抽选无关（界面、设置、安装）
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 抽取模式
      options:
        - 不放回
        - 放回
        - 不确定
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 应用设置 → 插件 里能看到。
      placeholder: 2.0.0.0
    validations:
      required: true

  - type: input
    id: ci-version
    attributes:
      label: ClassIsland 版本
      description: 标题栏或「关于」里能看到。
      placeholder: 2.1.0.1
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统
      description: Windows 版本号，截图里显示的系统信息也行。
      placeholder: Windows 11 23H2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        ClassIsland 数据目录下的 `Logs/` 里，最新的那个日志文件。
        整份太长的话，贴和 随机抽选 / RandomPicker 相关的那几行就够。
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 截图或其他补充
      description: |
        截图直接拖进这个框就行。
        名单相关的问贴一下 `Config/Plugins/gordon.randompicker/namelib/listN.txt` 的内容（人名可以打码）。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这个问题出在本插件上，不是 ClassIsland 本身的问题
          required: true
        - label: 我已经把插件升到最新版本，问题仍然存在
          required: false
